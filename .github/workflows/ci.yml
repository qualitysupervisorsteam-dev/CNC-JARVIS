name: CNC-JARVIS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cncjarvis .
          fi
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.cncjarvis .
          fi
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-JARVIS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows Native CAD and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows project exists
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --org com.cncjarvis .
          }
          if (Test-Path "test\widget_test.dart") {
            Remove-Item "test\widget_test.dart" -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Install OpenCASCADE with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet=x64-windows `
            --x-manifest-root="${{ github.workspace }}\native\cad"

          $occt = Join-Path $env:GITHUB_WORKSPACE "native\cad\vcpkg_installed\x64-windows"
          if (-not (Test-Path $occt)) {
            throw "OpenCASCADE installation directory was not created: $occt"
          }

          $config = Get-ChildItem -Path $occt -Filter "OpenCASCADEConfig.cmake" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $config) {
            throw "OpenCASCADEConfig.cmake was not found under $occt"
          }

          "OCCT_ROOT=$occt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OCCT_CONFIG_DIR=$($config.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure native CAD
        shell: pwsh
        run: |
          cmake `
            -S native\cad `
            -B native\cad\build `
            -A x64 `
            "-DOCCT_ROOT=$env:OCCT_ROOT" `
            "-DOpenCASCADE_DIR=$env:OCCT_CONFIG_DIR"

      - name: Build native CAD
        run: cmake --build native\cad\build --config Release

      - name: Run native CAD tests
        run: ctest --test-dir native\cad\build --build-config Release --output-on-failure

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle native runtime
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) {
            throw "Flutter Windows release directory was not created: $release"
          }

          Copy-Item "native\cad\build\Release\cnc_cad.dll" $release -Force

          $dlls = Get-ChildItem -Path $env:OCCT_ROOT -Filter "TK*.dll" -Recurse -ErrorAction SilentlyContinue
          if (-not $dlls) {
            throw "No OpenCASCADE runtime DLLs (TK*.dll) were found under $env:OCCT_ROOT"
          }

          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName $release -Force
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE "CNC-JARVIS-Windows-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$release\*" -DestinationPath $zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CNC-JARVIS-Windows-x64
          path: CNC-JARVIS-Windows-x64.zip
          if-no-files-found: error
