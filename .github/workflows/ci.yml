name: CNC-JARVIS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Analyze and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android project is missing."
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CNC-JARVIS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows CAD + Release
    runs-on: windows-latest
    needs: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Windows project
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            throw "Windows Flutter project is missing."
          }

      - name: Verify vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on the runner."
          }

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: Install OpenCASCADE with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet=x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE\native\cad"

      - name: Locate OpenCASCADE
        shell: pwsh
        run: |
          $occtRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "native\cad\vcpkg_installed\x64-windows"

          $config = Join-Path `
            $occtRoot `
            "share\opencascade\OpenCASCADEConfig.cmake"

          $header = Join-Path `
            $occtRoot `
            "include\opencascade\Standard.hxx"

          if (-not (Test-Path $config)) {
            throw "OpenCASCADEConfig.cmake was not found at $config"
          }

          if (-not (Test-Path $header)) {
            throw "OpenCASCADE Standard.hxx was not found at $header"
          }

          "OCCT_ROOT=$occtRoot" >> $env:GITHUB_ENV
          "OpenCASCADE_DIR=$(Split-Path $config -Parent)" >> $env:GITHUB_ENV

          Write-Host "OCCT_ROOT=$occtRoot"
          Write-Host "OpenCASCADE_DIR=$(Split-Path $config -Parent)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Configure native CAD
        shell: pwsh
        run: |
          cmake `
            -S native\cad `
            -B native\cad\build `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows" `
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE\native\cad" `
            "-DOCCT_ROOT=$env:OCCT_ROOT" `
            "-DOpenCASCADE_DIR=$env:OpenCASCADE_DIR"

      - name: Build native CAD
        shell: pwsh
        run: |
          cmake `
            --build native\cad\build `
            --config Release `
            --parallel

      - name: Native CAD tests
        shell: pwsh
        run: |
          ctest `
            --test-dir native\cad\build `
            --build-config Release `
            --output-on-failure

      - name: Flutter tests
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle native CAD DLL
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"

          if (-not (Test-Path $release)) {
            throw "Flutter Windows release directory was not found."
          }

          $cadDll = "native\cad\build\Release\cnc_cad.dll"

          if (-not (Test-Path $cadDll)) {
            throw "cnc_cad.dll was not produced."
          }

          Copy-Item $cadDll $release -Force

      - name: Bundle OpenCASCADE runtime DLLs
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $occtBin = Join-Path $env:OCCT_ROOT "bin"

          if (-not (Test-Path $occtBin)) {
            throw "OpenCASCADE bin directory was not found: $occtBin"
          }

          $dlls = Get-ChildItem `
            -Path $occtBin `
            -Filter "TK*.dll" `
            -File

          if ($dlls.Count -eq 0) {
            throw "No OpenCASCADE TK*.dll files were found."
          }

          Copy-Item `
            -Path $dlls.FullName `
            -Destination $release `
            -Force

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $zip = "CNC-JARVIS-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: CNC-JARVIS-Windows-x64
          path: CNC-JARVIS-Windows-x64.zip
          if-no-files-found: error
